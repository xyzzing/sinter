[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinter"
version = "0.1.0"
description = "Local inference supervisor for AMD ROCm workstations"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "SINTER Contributors"}]
keywords = ["llama.cpp", "rocm", "inference", "supervisor", "gguf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
homepage = "https://github.com/xyzzing/sinter"
repository = "https://github.com/xyzzing/sinter"

[project.scripts]
sinter = "sinter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/sinter"]