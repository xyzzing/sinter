[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sinter"
version = "0.1.0"
description = "Local inference supervisor for AMD ROCm workstations"
readme = "SPEC.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SINTER Contributors"}]
keywords = ["llama.cpp", "rocm", "inference", "supervisor", "gguf"]

[project.scripts]
sinter = "sinter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/sinter"]